name: ✨ Шинэ боломж санал болгох
description: Дархай (Darhai)-д нэмэхийг хүссэн санаагаа хуваалцах
title: '[Санал]: '
labels: ['enhancement']
body:
  - type: textarea
    id: feature_description
    attributes:
      label: Боломжийн тодорхойлолт
      description: Та ямар боломж нэмэгдээсэй гэж хүсэж байгаагаа товч бөгөөд тодорхой бичнэ үү.
      placeholder: Хүсэж буй боломжоо тайлбарлана уу...
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Шийдэх асуудал
      description: Энэ боломж ямар асуудлыг шийдэх вэ?
      placeholder: Энэ боломж ямар асуудал буюу хязгаарлалтыг арилгах вэ?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Санал болгож буй шийдэл
      description: Хэрэгжээсэй гэж хүсэж буй шийдлээ тайлбарлана уу.
      placeholder: Энэ боломж хэрхэн ажиллаасай гэж хүсэж байна вэ?
    validations:
      required: true

  - type: dropdown
    id: feature_category
    attributes:
      label: Боломжийн ангилал
      description: Энэ боломж аль ангилалд хамаарах вэ?
      options:
        - UI/UX сайжруулалт
        - AI загварын интеграц
        - Файлын менежмент
        - Олон агентын дэмжлэг
        - Гүйцэтгэл
        - Бусад
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Нэмэлт мэдээлэл
      description: Энэ саналтай холбоотой бусад мэдээллийг эндээ нэмнэ үү.
      placeholder: Хэрэглээний жишээ, зураглал гэх мэт.
